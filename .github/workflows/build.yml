name: Validate MiniMap package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate release package
        shell: powershell
        env:
          # Keep deeply nested disposable import fixtures within .NET Framework's path budget.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: .\Build.ps1 -Configuration Release -OutputDirectory release/ci
      - name: Verify viewport streaming against the packaged executable
        shell: powershell
        run: .\tests\Test-MapStreaming.ps1 -Executable release/ci/SkynettMiniMap.exe -OutputDirectory release/streaming-checks
      - name: Verify exact-package UI, recovery, colours, settings and setup
        shell: powershell
        run: .\scripts\Test-WpfCandidate.ps1 -Executable release/ci/SkynettMiniMap.exe -EvidenceDirectory release/candidate-checks
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MiniMap-validated-package
          path: |
            release/ci/SkynettMiniMap.exe
            release/ci/SkynettMiniMap.zip
            release/ci/update.txt
            release/ci/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Test encrypted relay and persistent groups
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes -keyout /tmp/minimap-test.key -out /tmp/minimap-test.crt -subj /CN=localhost
          TEST_KEY=/tmp/minimap-test.key TEST_CERT=/tmp/minimap-test.crt npm test
