name: Validate MiniMap package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate release package
        shell: powershell
        run: .\Build.ps1 -Configuration Release -OutputDirectory release/ci
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MiniMap-validated-package
          path: |
            release/ci/SkynettMiniMap.exe
            release/ci/SkynettMiniMap.zip
            release/ci/update.txt
            release/ci/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
